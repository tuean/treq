[workspace]
resolver = "2"
members = ["crates/treq-core", "crates/treq-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "charset", "json"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
dirs = "6"